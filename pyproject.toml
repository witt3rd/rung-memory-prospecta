[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rung-memory-prospecta"
version = "0.1.0"
description = "Prospecta as a rung memory provider: an MCP server speaking rung-memory/1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prospecta[defaults] @ git+https://github.com/witt3rd/prospecta@e9025a7e6c7fb30e8ed39d40b22c2fb1b9fa73fa",
    "mcp>=1.30,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
st = ["prospecta[embedder] @ git+https://github.com/witt3rd/prospecta@e9025a7e6c7fb30e8ed39d40b22c2fb1b9fa73fa"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rung-memory-prospecta = "rung_memory_prospecta.cli:main"

[tool.setuptools.packages.find]
where = ["provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S105", "S106", "S108"]
